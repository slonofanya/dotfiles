gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript application/xml application/rss+xml application/atom+xml image/svg+xml font/woff2;

server {
  listen 80;
  server_name test1.org www.test1.org _;
  root /var/www;
  index index.html;

  location /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
  }

  if ($host ~* "^(test1\.org|www\.test1\.org)$") {
    return 301 https://$host$request_uri;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.(?:html)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}

server {
  listen 443 ssl http2;
  server_name test1.org www.test1.org;
  root /var/www;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/test1.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/test1.org/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  location /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.(?:html)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}

