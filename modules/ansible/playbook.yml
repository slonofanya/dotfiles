- name: Install docker
  gather_facts: yes
  hosts: test
  become: true
  tasks:
    - name: Ping test
      ping:

    - name: Update apt cache (with cache validity check)
      apt:
        update_cache: yes
        cache_valid_time: 3600  # Cache valid for 1 hour
      changed_when: false

    - name: Install aptitude
      apt:
        name: aptitude
        state: present
        force_apt_get: yes

    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
        state: present
        update_cache: no  # Already updated above
      register: install_packages

    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      register: docker_key

    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
        update_cache: no
      register: docker_repo

    - name: Update apt cache (only if repo or key changed)
      apt:
        update_cache: yes
      when: docker_key.changed or docker_repo.changed
      changed_when: false

    - name: Install docker-ce
      apt:
        name: docker-ce
        state: present
        update_cache: no

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      when: ansible_user is defined
